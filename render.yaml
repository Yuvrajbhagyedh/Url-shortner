# Single free web service — no paid Postgres / Redis.
# Dashboard: New + → Web Service → this repo → Docker → Free.
# Or Blueprint: only creates shortx-web.

services:
  - type: web
    name: shortx-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite+pysqlite:////app/shortx.db
      - key: REDIS_URL
        value: memory://
      - key: CELERY_ALWAYS_EAGER
        value: "1"
      - key: SHORTX_LOCAL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: CORS_ORIGINS
        value: "*"
