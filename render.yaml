# Render Blueprint for ShortX.
# In the Render dashboard: New + -> Blueprint -> pick this repo. It provisions
# a Postgres DB, a Redis (Key Value) store, the FastAPI backend, and the static
# React frontend. See DEPLOY.md for the two manual env values to fill in after.

databases:
  - name: shortx-db
    plan: free
    databaseName: shortx
    user: shortx

services:
  # ---- Redis (cache + rate limiting) ----
  - type: keyvalue
    name: shortx-redis
    plan: free
    ipAllowList: []          # internal access only
    maxmemoryPolicy: allkeys-lru

  # ---- FastAPI backend (runs Celery tasks inline; no separate worker) ----
  - type: web
    name: shortx-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: CELERY_ALWAYS_EAGER
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: shortx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shortx-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: shortx-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: shortx-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      # BASE_URL auto-derives from RENDER_EXTERNAL_URL (the API's own URL).
      # Set CORS_ORIGINS to the frontend URL after the frontend deploys.
      - key: CORS_ORIGINS
        sync: false

  # ---- React + Vite frontend (static) ----
  - type: web
    name: shortx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to the backend URL (https://shortx-api.onrender.com) after it deploys.
      - key: VITE_API_BASE
        sync: false
